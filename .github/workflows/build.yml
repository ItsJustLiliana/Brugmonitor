name: Build Brugmonitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Test server
        run: python -m unittest discover -s tests -v
      - name: Package server
        run: python scripts/package-server.py
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Brugmonitor-server
          path: dist/Brugmonitor-server.zip
          if-no-files-found: error
          retention-days: 30

  android:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore Firebase configuration and existing signing key
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: python scripts/prepare-ci-android.py
      - name: Build and lint
        working-directory: android
        env:
          BRUGMONITOR_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Brugmonitor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
