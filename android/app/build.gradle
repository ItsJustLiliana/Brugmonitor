plugins { id 'com.android.application' }
def appConfigFile = rootProject.file('../app_config.json')
if (!appConfigFile.isFile()) {
    throw new GradleException('app_config.json ontbreekt in de projectmap.')
}
def appConfig
try {
    appConfig = new groovy.json.JsonSlurper().parse(appConfigFile, 'UTF-8')
} catch (Exception error) {
    throw new GradleException('app_config.json bevat ongeldige JSON.', error)
}
if (!(appConfig instanceof Map) || !(appConfig.version instanceof String) || !(appConfig.version ==~ /[0-9]+[.][0-9]+[.][0-9]+/)) {
    throw new GradleException('Gebruik in app_config.json een version zoals 0.3.2.')
}
if (!(appConfig.buildNumber instanceof Integer || appConfig.buildNumber instanceof Long) || appConfig.buildNumber <= 0 || appConfig.buildNumber > 2100000000) {
    throw new GradleException('buildNumber in app_config.json moet een positief geheel getal zijn, maximaal 2100000000.')
}
if (appConfig.androidApplicationId != 'nl.brugmonitor.app') {
    throw new GradleException('androidApplicationId moet nl.brugmonitor.app blijven voor bestaande installaties en Firebase.')
}
if (!(appConfig.updateFeedUrl instanceof String) || !appConfig.updateFeedUrl.startsWith('https://')) {
    throw new GradleException('updateFeedUrl in app_config.json moet een HTTPS-adres zijn.')
}
int configuredVersionCode = appConfig.buildNumber.intValue()
String configuredVersionName = appConfig.version
def firebaseConfigured = file('google-services.json').exists()
if (firebaseConfigured) { apply plugin: 'com.google.gms.google-services' }
android {
    namespace 'nl.brugmonitor.app'
    compileSdk 36
    defaultConfig {
        applicationId appConfig.androidApplicationId
        minSdk 26
        targetSdk 36
        versionCode configuredVersionCode
        versionName configuredVersionName
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigured.toString()
        buildConfigField 'String', 'UPDATE_FEED_URL', groovy.json.JsonOutput.toJson(appConfig.updateFeedUrl)
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-firestore'
}
tasks.register('syncWeb', Copy) { from rootProject.file('../index.html'); into 'src/main/assets' }
tasks.named('preBuild').configure { dependsOn 'syncWeb' }
